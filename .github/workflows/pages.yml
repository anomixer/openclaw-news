name: Deploy MkDocs Site
on:
  push:
    branches:
      - main
      - murmur-runner
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r code/requirements.txt

      - name: Prepare build directory
        run: node code/build_prep.js

      - name: Generate RSS feeds
        run: node code/gen_feed.js

      - name: Build EN and ZH in parallel
        run: |
          cp code/mkdocs.yml mkdocs-en.yml
          cp code/mkdocs.tw.yml mkdocs-tw.yml
          mkdocs build -f mkdocs-en.yml &
          EN_PID=$!
          mkdocs build -f mkdocs-tw.yml -d site-tw &
          TW_PID=$!
          wait $EN_PID
          EN_RC=$?
          wait $TW_PID
          TW_RC=$?
          if [ $EN_RC -ne 0 ] || [ $TW_RC -ne 0 ]; then
            echo "EN exit: $EN_RC, TW exit: $TW_RC"
            exit 1
          fi
          mkdir -p site/tw
          cp -r site-tw/. site/tw/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
